<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Number Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Random Number Generator</h1>
    <div class="choices">
      <div class="choice" id="ten" >
        <button >Generate a number between 0 and 10</button>
      </div>

      <div class="choice" id="hundred">
        <button>Generate a number between 0 and 100</button>
      </div>

      <div class="choice" id="thousand">
        <button>Generate a number between 0 and 1000</button>
      </div>

      <div class="choice" id="ten-thousand">
        <button>Generate a number between 0 and 10000</button>
      </div>

      <div class="choice" id="hundred-thousand">
        <button>Generate a number between 0 and 100000</button>
      </div>
    </div>

  <div class="genNum">
  <h3 class="num" hidden>
    The number is <br>
    <span id="result"></span>
  </h3>
</div>

<footer class="tail-bar">
  Made with ❤️ by Saurab Dhakal and Nitish
</footer>



    <script src="randNum.js"></script>
  </body>
</html>
